<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Object Detection</title>
    <style>
        body{
            margin:0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #camera-feed-container{
            position: relative;
            width:  100%;
            max-width: 640px;
            margin: auto;
        }
        video{
            display: block;
            width: 100%;
            height: auto;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events:none;
        }
        button{
            margin: 20px;
            padding: 12px 24px;
            font-size: 16px;
        }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
    <h1>Simple Object Detection</h1>
    <button id="start-button">Start Detection</button>

    <div id="camera-feed-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>

    <p id = "status" >Camera Not Started</p>
    <script src="./script.js"></script> 
</body>
</html>
